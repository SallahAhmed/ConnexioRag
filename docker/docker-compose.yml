services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27007:27017"

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    restart: always

volumes:
  mongodb_data:


networks:
  backend:
    driver: bridge
