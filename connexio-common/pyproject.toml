[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connexio-common"
version = "0.1.0"
description = "Shared utilities for Connexio RAG and MasarX Agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.55.3",
    "cohere>=5.21.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "PyJWT>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
