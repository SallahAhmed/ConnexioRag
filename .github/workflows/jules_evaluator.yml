name: Jules 8-Hour Auto-Evaluator

on:
  schedule:
    # Run every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  evaluate-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Update to match your desired python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Jules Evaluator Script
        env:
          RAG_API_URL: ${{ secrets.RAG_API_URL }}
          CONNEXIO_INTERNAL_API_KEY: ${{ secrets.CONNEXIO_INTERNAL_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_ENDPOINT: ${{ secrets.JULES_API_ENDPOINT }}
        run: |
          python scripts/jules_auto_evaluator.py
