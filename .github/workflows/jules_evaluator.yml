name: Jules 8-Hour Auto-Evaluator

on:
  schedule:
    # Run every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

# Opt-in to the modern Node.js 24 runtime system-wide
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  evaluate-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Upgraded from v3 (supports Node 20/24)

      - name: Set up Python
        uses: actions/setup-python@v5  # Upgraded from v4 (supports Node 20/24)
        with:
          python-version: '3.13.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Jules Evaluator Script
        env:
          RAG_API_URL: ${{ secrets.RAG_API_URL }}
          CONNEXIO_INTERNAL_API_KEY: ${{ secrets.CONNEXIO_INTERNAL_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_ENDPOINT: ${{ secrets.JULES_API_ENDPOINT }}
        run: |
          python scripts/jules_auto_evaluator.py
